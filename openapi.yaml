openapi: 3.0.3
info:
  title: Alfa Biz Credit AI - API Specification
  description: >
    Интеллектуальная система кредитования малого и среднего бизнеса (МСБ) с использованием
    AI-скоринга, цифрового профиля компании и автоматизированного конвейера принятия решений.
  version: 1.0.0
  contact:
    name: Alfa-Bank AI Engineering Team

servers:
  - url: http://localhost:8080
    description: Основной Go-бэкенд API
  - url: http://localhost:8000
    description: Python ML-сервис скоринга

tags:
  - name: Auth
    description: Регистрация и аутентификация пользователей
  - name: Dashboard
    description: Главная панель клиента (финансы, новости, скоринг)
  - name: Products
    description: Каталог кредитных продуктов банка
  - name: Applications
    description: Полный жизненный цикл кредитной заявки (клиент)
  - name: Officer
    description: Рабочее место кредитного офицера (андеррайтинг)
  - name: AI Advisor
    description: Интеллектуальный финансовый консультант на базе LLM
  - name: Scoring Service
    description: Внутренний микросервис кредитного скоринга рисков
  - name: System
    description: Служебные эндпоинты проверки работоспособности

paths:
  /healthz:
    get:
      tags:
        - System
      summary: Проверка работоспособности сервиса и БД
      responses:
        '200':
          description: Сервис и база данных работают штатно
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unavailable

  /health:
    get:
      tags:
        - System
      summary: Проверка работоспособности сервиса AI-советника
      responses:
        '200':
          description: Сервис доступен
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация новой компании и клиента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Успешная регистрация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации данных
        '409':
          description: Пользователь или ИНН уже существуют

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Авторизация в системе по email и паролю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная авторизация, выдан JWT-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверные учетные данные

  /api/dashboard:
    get:
      tags:
        - Dashboard
      summary: Получение данных дашборда клиента
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Данные профиля компании, доступный лимит и персонализированные новости
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          description: Не авторизован

  /api/products:
    get:
      tags:
        - Products
      summary: Каталог кредитных продуктов банка
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список кредитных продуктов с лимитами и процентными ставками
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

  /api/company/lookup:
    get:
      tags:
        - Company
      summary: Автозаполнение реквизитов по ИНН (UC 1.3)
      description: Возвращает реквизиты компании из локального мока ФНС/ЕГРЮЛ для предзаполнения формы заявки.
      security:
        - BearerAuth: []
      parameters:
        - name: inn
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{10,12}$'
          description: ИНН организации (10 или 12 цифр)
      responses:
        '200':
          description: Реквизиты компании
          content:
            application/json:
              schema:
                type: object
                properties:
                  inn:
                    type: string
                  name:
                    type: string
                  okved:
                    type: string
                  registration_date:
                    type: string
                  company_age_months:
                    type: integer
                  status:
                    type: string
                  source:
                    type: string
        '400':
          description: Некорректный ИНН

  /internal/mocks/fns/{inn}:
    get:
      tags:
        - Mocks
      summary: Мок ФНС «Прозрачный бизнес» / ЕГРЮЛ (UC 3.1)
      description: Симулятор государственного сервиса. Для известных ИНН возвращает данные из каталога, для остальных — детерминированно сгенерированные.
      parameters:
        - name: inn
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные ФНС/ЕГРЮЛ
          content:
            application/json:
              schema:
                type: object
                properties:
                  inn:
                    type: string
                  name:
                    type: string
                  okved:
                    type: string
                  registration_date:
                    type: string
                  company_age_months:
                    type: integer
                  status:
                    type: string
                  has_bankruptcy:
                    type: boolean
                  source:
                    type: string

  /internal/mocks/bki/{inn}:
    get:
      tags:
        - Mocks
      summary: Мок бюро кредитных историй (UC 3.1)
      description: Симулятор БКИ. Для известных ИНН возвращает данные из каталога, для остальных — детерминированно сгенерированные.
      parameters:
        - name: inn
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Кредитная история
          content:
            application/json:
              schema:
                type: object
                properties:
                  inn:
                    type: string
                  active_loans:
                    type: integer
                  bki_active_loans_monthly_payment:
                    type: integer
                  bki_delinquency_days:
                    type: integer
                  has_bankruptcy:
                    type: boolean
                  credit_history_score:
                    type: integer
                  source:
                    type: string

  /api/applications:
    get:
      tags:
        - Applications
      summary: Список всех кредитных заявок текущей компании
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Реестр кредитных заявок компании
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
    post:
      tags:
        - Applications
      summary: Создание новой кредитной заявки (статус DRAFT)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Заявка успешно создана в статусе DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Параметры не соответствуют условиям продукта

  /api/applications/{id}:
    get:
      tags:
        - Applications
      summary: Получение подробной информации о заявке, включая таймлайн изменений статусов
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID заявки
      responses:
        '200':
          description: Полная информация о заявке с историей переходов (status_logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          description: Заявка не найдена

  /api/applications/{id}/submit:
    post:
      tags:
        - Applications
      summary: Отправка заявки на автоматический AI-скоринг
      description: >
        Переводит заявку из DRAFT в SCORING_IN_PROGRESS, обогащает данные через ФНС и БКИ,
        запрашивает решение ML-сервиса и возвращает небинарный исход (APPROVED, COUNTER_OFFER,
        DOCS_REQUIRED, MANUAL_REVIEW, REJECTED).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Результат скоринга и обновленная заявка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '409':
          description: Недопустимый статус заявки для скоринга

  /api/applications/{id}/counter-offer:
    post:
      tags:
        - Applications
      summary: Реакция клиента на встречное предложение банка (принять / отклонить)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterOfferRequest'
      responses:
        '200':
          description: Обновленный статус заявки (APPROVED при accept или CANCELLED_BY_CLIENT при reject)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'

  /api/applications/{id}/documents:
    post:
      tags:
        - Applications
      summary: Загрузка подтверждающих бухгалтерских документов
      description: >
        Принимает PDF или изображения до 5 МБ в поле multipart 'file' или 'document',
        сохраняет документ и инициирует повторный скоринг с переходом в MANUAL_REVIEW.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл бухгалтерской отчетности (PDF, PNG, JPG)
      responses:
        '200':
          description: Документ сохранен, заявка направлена на андеррайтинг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '413':
          description: Превышен допустимый размер файла

  /api/applications/{id}/documents/{doc_id}:
    get:
      tags:
        - Applications
      summary: Скачивание прикрепленного документа заявки
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: doc_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Бинарное содержимое файла
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary

  /api/applications/{id}/sign:
    post:
      tags:
        - Applications
      summary: Подписание кредитного договора SMS-кодом и выдача средств
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignApplicationRequest'
      responses:
        '200':
          description: Договор подписан, статус изменен на ISSUED, баланс компании пополнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: "Неверный код подтверждения (демо-код: 1234)"

  /api/officer/applications:
    get:
      tags:
        - Officer
      summary: Список всех заявок банка для кредитного офицера
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по статусу (например MANUAL_REVIEW,DOCS_REQUIRED)
      responses:
        '200':
          description: Список заявок с документами, компанией и историей переходов
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'

  /api/officer/applications/{id}/decision:
    post:
      tags:
        - Officer
      summary: Принятие ручного решения кредитным офицером
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficerDecisionRequest'
      responses:
        '200':
          description: Решение зафиксировано, статус заявки обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Некорректные параметры решения или условия кредитования

  /api/v1/advice/compare:
    post:
      tags:
        - AI Advisor
      summary: Сравнение двух кредитных продуктов с помощью LLM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_a
                - product_b
              properties:
                product_a:
                  type: string
                  example: Овердрафт
                product_b:
                  type: string
                  example: Оборотный кредит
      responses:
        '200':
          description: Сравнительный финансовый анализ продуктов
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: comparison
                  product_a:
                    type: string
                  product_b:
                    type: string
                  advice:
                    type: string

  /api/v1/advice/contextual:
    post:
      tags:
        - AI Advisor
      summary: Получение персонализированной финансовой рекомендации для клиента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisorContextualRequest'
      responses:
        '200':
          description: Индивидуальная рекомендация LLM
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: contextual_advice
                  client:
                    type: string
                  advice:
                    type: string

  /api/v1/advice/explain-decision:
    post:
      tags:
        - AI Advisor
      summary: Объяснение решения банка простым языком для клиента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisorDecisionRequest'
      responses:
        '200':
          description: Разъяснение решения с практическими рекомендациями по улучшению показателей
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: decision_explanation
                  decision:
                    type: string
                  explanation:
                    type: string

  /api/v1/advice/officer-summary:
    post:
      tags:
        - AI Advisor
      summary: Краткая выжимка по заявке для риск-офицера (UC 2.2)
      description: Генерирует уровень риска, ключевые факторы и рекомендацию. При недоступности LLM используется детерминированный fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - application_id
              properties:
                application_id:
                  type: integer
                company_name:
                  type: string
                inn:
                  type: string
                okved:
                  type: string
                company_age_months:
                  type: integer
                monthly_revenue:
                  type: number
                monthly_net_profit:
                  type: number
                requested_amount:
                  type: number
                requested_term_months:
                  type: integer
                score_value:
                  type: number
                dsti:
                  type: number
                bki_delinquency_days:
                  type: integer
                bki_active_loans_monthly_payment:
                  type: number
                has_bankruptcy:
                  type: boolean
                status:
                  type: string
      responses:
        '200':
          description: Краткая выжимка для офицера
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: officer_summary
                  summary:
                    type: string
                    example: "Риск высокий. Низкая выручка и критический DSTI. Рекомендую отказать."

  /api/v1/scoring/evaluate:
    post:
      tags:
        - Scoring Service
      summary: Расчет скоринга рисков заявки (Python Microservice)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringEvaluateRequest'
      responses:
        '200':
          description: Небинарное решение скоринга с расчетом DSTI, факторов и LLM-объяснением
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringEvaluateResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - company_name
        - inn
        - okved
      properties:
        email:
          type: string
          format: email
          example: client@example.com
        password:
          type: string
          example: secretPass123
        company_name:
          type: string
          example: ООО "Технологии Будущего"
        inn:
          type: string
          example: "7701234567"
        okved:
          type: string
          example: "62.01"
        revenue:
          type: integer
          example: 12000000

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: client1
        password:
          type: string
          example: "123"

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        role:
          type: string
          enum: [client, officer]
          example: client
        inn:
          type: string
          example: "7701100001"
        company_name:
          type: string
          example: ООО "Стабильный Бизнес"

    DashboardResponse:
      type: object
      properties:
        company_info:
          $ref: '#/components/schemas/Company'
        calculated_limit:
          type: integer
          example: 4500000
        news:
          type: array
          items:
            $ref: '#/components/schemas/NewsArticle'

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: Оборотный кредит
        min_amount:
          type: integer
          example: 300000
        max_amount:
          type: integer
          example: 15000000
        min_term_months:
          type: integer
          example: 3
        max_term_months:
          type: integer
          example: 36
        interest_rate:
          type: number
          format: float
          example: 16.5
        description:
          type: string
          example: Финансирование кассовых разрывов и пополнение оборотных средств

    Company:
      type: object
      properties:
        id:
          type: integer
        inn:
          type: string
          example: "7701100001"
        name:
          type: string
          example: ООО "Стабильный Бизнес"
        okved:
          type: string
          example: "62.01"
        monthly_revenue:
          type: integer
          example: 2500000
        monthly_net_profit:
          type: integer
          example: 650000
        company_age_months:
          type: integer
          example: 36
        bki_active_loans_monthly_payment:
          type: integer
          example: 45000
        bki_delinquency_days:
          type: integer
          example: 0
        has_bankruptcy:
          type: boolean
          example: false
        balance:
          type: integer
          example: 5200000

    ApplicationStatusLog:
      type: object
      properties:
        id:
          type: integer
          example: 1
        application_id:
          type: integer
          example: 42
        from_status:
          type: string
          example: DRAFT
        to_status:
          type: string
          example: SCORING_IN_PROGRESS
        comment:
          type: string
          example: Заявка отправлена на скоринг рисков
        created_at:
          type: string
          format: date-time
          example: 2026-10-25T18:45:00Z

    ApplicationDocument:
      type: object
      properties:
        id:
          type: integer
          example: 5
        application_id:
          type: integer
          example: 42
        filename:
          type: string
          example: balance_2025.pdf
        created_at:
          type: string
          format: date-time

    Application:
      type: object
      properties:
        id:
          type: integer
          example: 42
        user_id:
          type: integer
          example: 1
        company_id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 2
        purpose:
          type: string
          example: Пополнение оборотных средств
        status:
          type: string
          enum:
            - DRAFT
            - DATA_ENRICHMENT
            - SCORING_IN_PROGRESS
            - APPROVED
            - COUNTER_OFFER
            - DOCS_REQUIRED
            - DOCS_UPLOADED
            - MANUAL_REVIEW
            - REJECTED
            - PENDING_SIGNATURE
            - ISSUED
            - CANCELLED_BY_CLIENT
          example: APPROVED
        amount:
          type: integer
          example: 1500000
        term_months:
          type: integer
          example: 12
        requested_amount:
          type: integer
          example: 1500000
        requested_term_months:
          type: integer
          example: 12
        approved_amount:
          type: integer
