services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-alfa_credit}
      POSTGRES_USER: ${DB_USER:-alfa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alfa_2026}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  llm-proxy:
    build:
      context: .
      dockerfile: Dockerfile.wireguard
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - WG_PRIVATE_KEY=${WG_PRIVATE_KEY:?Задайте WG_PRIVATE_KEY в .env для доступа к LLM}
      - WG_ADDRESS=${WG_ADDRESS:-10.154.53.14/16}
      - WG_PEER_PUBLIC_KEY=${WG_PEER_PUBLIC_KEY:-81kxTfIHmSpiPMZdeEBakD0w1seqr+C27aQePY2D0F4=}
      - WG_ENDPOINT=${WG_ENDPOINT:-93.190.110.225:56598}
    restart: unless-stopped

  backend:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-alfa}
      DB_PASSWORD: ${DB_PASSWORD:-alfa_2026}
      DB_NAME: ${DB_NAME:-alfa_credit}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Скопируйте .env.example в .env и задайте JWT_SECRET}
      PORT: "8080"
      GIN_MODE: release
      AI_BASE_URL: ${AI_BASE_URL:-http://llm-proxy:8080/v1}
      AI_MODEL: ${AI_MODEL:-gemma4:12b}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-30}
      SCORING_BASE_URL: ${SCORING_BASE_URL:-http://scoring:8000}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      scoring:
        condition: service_started
      llm-proxy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    stop_grace_period: 15s

  # Прозрачный движок скоринга с AI-объяснением (немного небинарных исходов).
  scoring:
    build:
      context: .
      dockerfile: Dockerfile.scoring
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-http://llm-proxy:8080/v1}
      AI_MODEL: ${AI_MODEL:-gemma4:12b}
      AI_API_KEY: ${AI_API_KEY:-}
      # Бюджет LLM держим ниже HTTP-таймаута Go-клиента (40с), иначе бэкенд
      # уйдёт в fallback раньше, чем сервис ответит.
      AI_TIMEOUT: ${SCORING_AI_TIMEOUT:-30.0}
      DSTI_APPROVE_MAX: ${DSTI_APPROVE_MAX:-0.35}
      DSTI_COUNTER_MAX: ${DSTI_COUNTER_MAX:-0.55}
    ports:
      - "${SCORING_PORT:-8000}:8000"
    depends_on:
      llm-proxy:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
